<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>세미콜론 리모트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#F2EEE6; --ink:#1B1E1A; --green:#1F4A38; --green-lit:#2F7A5B;
  --apricot:#E39B6A; --mute:#8C8579; --line:#DCD5C8; --stage:#0F1512;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Pretendard,system-ui,sans-serif;background:var(--paper);color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--green-lit);outline-offset:3px}

#pick{min-height:100dvh;display:grid;place-items:center;padding:32px}
#pick .box{width:min(420px,100%)}
#pick h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
#pick p{color:var(--mute);font-size:14px;line-height:1.6;margin-bottom:28px}
.role{display:block;width:100%;text-align:left;padding:18px 20px;border:1px solid var(--line);
  border-radius:14px;background:#fff;margin-bottom:10px}
.role b{display:block;font-size:16px;font-weight:600;margin-bottom:3px}
.role span{font-size:13px;color:var(--mute)}
.role:hover{border-color:var(--green)}

#pc{position:fixed;inset:0;background:var(--stage);display:none;color:#EDEBE4}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#panel{position:absolute;top:22px;left:22px;background:rgba(15,21,18,.84);
  border:1px solid rgba(237,235,228,.14);border-radius:16px;padding:18px;width:250px;backdrop-filter:blur(8px)}
#panel h2{font-size:12px;font-weight:600;color:#9FB3A8;margin-bottom:12px}
#code{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600;letter-spacing:.14em;
  color:var(--apricot);line-height:1;margin-bottom:14px}
#qr{background:#fff;padding:9px;border-radius:10px;width:fit-content;margin-bottom:12px}
#qr img,#qr canvas{display:block}
#url{font-size:10px;color:#7F8F86;word-break:break-all;line-height:1.5;margin-bottom:12px}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.stat span:first-child{color:#7F8F86}
.stat span:last-child{font-family:'IBM Plex Mono',monospace}
#dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C4553F;margin-right:7px;vertical-align:1px}
#dot.on{background:var(--green-lit)}
#hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:12px;
  color:#5E6D64;text-align:center}
kbd{font-family:'IBM Plex Mono',monospace;background:rgba(237,235,228,.1);padding:2px 6px;border-radius:5px;font-size:11px}

#remote{display:none;min-height:100dvh;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
#rjoin{padding:40px 28px;display:flex;flex-direction:column;gap:14px;min-height:100dvh;justify-content:center}
#rjoin h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
#rjoin p{font-size:14px;color:var(--mute);line-height:1.6}
#codein{font-family:'IBM Plex Mono',monospace;font-size:30px;letter-spacing:.2em;text-align:center;
  padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-transform:uppercase;width:100%}
.cta{background:var(--green);color:#F4F1E9;padding:17px;border-radius:12px;font-size:16px;font-weight:600;text-align:center;width:100%}
.cta:active{background:var(--green-lit)}
#rerr{font-size:13px;color:#B4472F;min-height:18px}

#rpad{display:none;flex:1;flex-direction:column;padding:14px;gap:12px}
#rtop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
#aim{flex:1;border:1px solid var(--line);border-radius:18px;background:#fff;display:grid;place-items:center;
  text-align:center;padding:20px}
#aimTitle{font-size:17px;font-weight:600;margin-bottom:8px}
#aimSub{font-size:13px;color:var(--mute);line-height:1.6}
#btnCal{background:var(--apricot);color:#2A1A10;padding:18px;border-radius:14px;font-size:16px;font-weight:600;width:100%}
#btnCal:active{filter:brightness(.94)}
.abrow{display:flex;gap:12px}
.ab{flex:1;aspect-ratio:2.1;border-radius:16px;display:grid;place-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600}
.ab small{display:block;font-family:Pretendard,sans-serif;font-size:11px;font-weight:500;opacity:.72;margin-top:2px}
#btnA{background:var(--green);color:#F4F1E9}
#btnB{background:#fff;border:1px solid var(--line)}
.ab:active{transform:scale(.97)}
</style>
</head>
<body>

<section id="pick">
  <div class="box">
    <h1>세미콜론 리모트</h1>
    <p>폰을 컨트롤러로, 큰 화면을 게임 화면으로 씁니다.<br>기기마다 아래에서 역할을 고르세요.</p>
    <button class="role" data-role="pc"><b>이 기기를 게임 화면으로</b><span>노트북·모니터에서 선택. 방 코드가 나옵니다.</span></button>
    <button class="role" data-role="remote"><b>이 기기를 컨트롤러로</b><span>폰에서 선택. 방 코드를 입력해 연결합니다.</span></button>
  </div>
</section>

<section id="pc">
  <canvas id="stage"></canvas>
  <div id="panel">
    <h2><span id="dot"></span><span id="state">컨트롤러 기다리는 중</span></h2>
    <div id="code" class="mono">----</div>
    <div id="qr"></div>
    <div id="url"></div>
    <div class="stat"><span>지연</span><span id="ping">—</span></div>
    <div class="stat"><span>경로</span><span id="path">—</span></div>
  </div>
  <div id="hint"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 감도 · <kbd>C</kbd> 조준 초기화 · <kbd>H</kbd> 패널 · <kbd>M</kbd> 메뉴</div>
</section>

<section id="remote">
  <div id="rjoin">
    <h1>컨트롤러 연결</h1>
    <p>큰 화면에 표시된 네 글자 코드를 입력하세요.</p>
    <input id="codein" class="mono" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE">
    <button class="cta" id="btnJoin">연결하기</button>
    <div id="rerr"></div>
  </div>
  <div id="rpad">
    <div id="rtop"><span id="rstate">연결됨</span><span class="mono" id="rcode"></span></div>
    <div id="aim"><div>
      <div id="aimTitle">화면 가운데를 겨누세요</div>
      <div id="aimSub">폰 윗부분이 화면을 향하게 들고<br>아래 버튼을 누르면 조준이 맞춰집니다.</div>
    </div></div>
    <button id="btnCal">조준 맞추기</button>
    <div class="abrow">
      <button class="ab" id="btnA">A<small>선택 · 발사</small></button>
      <button class="ab" id="btnB">B<small>뒤로</small></button>
    </div>
  </div>
</section>

<script>
const P = new URLSearchParams(location.search);
const PREFIX = 'smcln-wii-';
const $ = s => document.querySelector(s);

// 서로 다른 네트워크(유선 랜 ↔ LTE)에서도 붙도록 TURN 중계를 함께 등록
const ICE = { iceServers: [
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
  {urls:'turn:openrelay.metered.ca:80',  username:'openrelayproject', credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject'},
]};
const role = P.get('role');
if (role === 'pc') startPC();
else if (role === 'remote') startRemote();
else document.querySelectorAll('.role').forEach(b => b.onclick = () => {
  P.set('role', b.dataset.role); location.search = P.toString();
});
function show(id){ $('#pick').style.display='none'; const e=$(id);
  e.style.display = (id==='#remote') ? 'flex' : 'block'; }
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;

/* =====================================================================
   게임 화면
   ===================================================================== */
function startPC(){
  show('#pc');
  const code = (P.get('code') || randCode()).toUpperCase();
  $('#code').textContent = code;
  const joinURL = location.origin + location.pathname + '?role=remote&code=' + code;
  $('#url').textContent = joinURL;
  new QRCode($('#qr'), {text:joinURL, width:126, height:126, correctLevel:QRCode.CorrectLevel.M});

  const cv = $('#stage'), ctx = cv.getContext('2d');
  let W=0,H=0;
  function resize(){
    const d = Math.min(devicePixelRatio||1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
  }
  addEventListener('resize', resize); resize();

  /* ---------- 조준 ---------- */
  let ref=null, raw={x:W/2,y:H/2}, cur={x:W/2,y:H/2}, prev={x:W/2,y:H/2}, vel=0;
  let DEG_X = 40, DEG_Y = 26;
  let rawT = performance.now(), rawV = {x:0,y:0}, rtt = 0;
  let tilt = {b:0, g:0};          // 보정 기준에서 벗어난 기울기(도) — 구슬 미로용
  function applyOrientation(o){
    if(!ref) return;
    tilt.b = clamp(o.b - ref.b, -30, 30);
    tilt.g = clamp(o.g - ref.g, -30, 30);
    const dA = ((o.a - ref.a + 540) % 360) - 180;
    const dB = o.b - ref.b;
    const nx = clamp(W/2 - dA*(W/DEG_X), 0, W);
    const ny = clamp(H/2 - dB*(H/DEG_Y), 0, H);
    const now = performance.now(), gap = Math.max((now-rawT)/1000, 0.004);
    rawV.x = (nx-raw.x)/gap; rawV.y = (ny-raw.y)/gap;
    raw.x = nx; raw.y = ny; rawT = now;
  }

  /* ---------- 상태 ---------- */
  let scene = 'menu';
  let game = null, gameId = null;
  let last = performance.now();
  let shake = 0, flash = 0, lastA = 0;
  const trail = [];

  const MENU = [
    {id:'slice',  name:'과일 자르기', desc:'폰을 빠르게 휘둘러 자르기', color:'#D9455F'},
    {id:'target', name:'표적 사격',   desc:'조준하고 A로 쏘기',        color:'#E39B6A'},
    {id:'space',  name:'우주 슈팅',   desc:'좌우로 움직이며 A로 발사', color:'#5C8FD6'},
    {id:'rhythm', name:'리듬 스윙',   desc:'화살표 방향으로 휘두르기', color:'#8E6BC4'},
    {id:'maze',   name:'구슬 미로',   desc:'폰을 기울여 구슬 굴리기',  color:'#2F7A5B'},
  ];
  let menuIdx = 0;

  /* ---------- 랭킹 ---------- */
  const hsKey = id => 'smcln-wii-hs-' + id;
  function best(id){ try{ return JSON.parse(localStorage.getItem(hsKey(id))) || []; }catch(e){ return []; } }
  function pushScore(id, s){
    const a = best(id); a.push(s); a.sort((x,y)=>y-x);
    try{ localStorage.setItem(hsKey(id), JSON.stringify(a.slice(0,5))); }catch(e){}
  }

  /* ---------- 입력 ---------- */
  function pressA(){
    if (scene==='menu') startGame(MENU[menuIdx].id);
    else if (scene==='play'){ game.fire && game.fire(); }
    else if (scene==='result') startGame(gameId);
  }
  function pressB(){
    if (scene==='play') endGame();
    else if (scene==='result'){ scene='menu'; sendPad('menu'); }
    else ref = null;
  }
  function startGame(id){
    gameId = id; game = MAKE[id](); scene = 'play'; sendPad(id);
  }
  function endGame(){
    if (game) pushScore(gameId, Math.max(0, Math.round(game.score)));
    scene = 'result'; sendPad('result');
  }

  /* ---------- 그리기 유틸 ---------- */
  function txt(s,x,y,size,color,weight,align){
    ctx.fillStyle=color; ctx.textAlign=align||'center'; ctx.textBaseline='alphabetic';
    ctx.font=(weight||600)+' '+size+'px Pretendard, sans-serif'; ctx.fillText(s,x,y);
  }
  function mono(s,x,y,size,color,align){
    ctx.fillStyle=color; ctx.textAlign=align||'center';
    ctx.font='600 '+size+'px "IBM Plex Mono", monospace'; ctx.fillText(s,x,y);
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function segDist(px,py,x1,y1,x2,y2){
    const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
    let t = L ? ((px-x1)*dx+(py-y1)*dy)/L : 0;
    t = clamp(t,0,1);
    return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
  }

  /* ---------- 소리 ---------- */
  let AC = null;
  function blip(freq, dur, type, gain){
    try{
      if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
      if (AC.state === 'suspended') { AC.resume(); return; }
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(gain||.2, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime+dur);
    }catch(e){}
  }
  addEventListener('pointerdown', ()=>{ if (AC && AC.state==='suspended') AC.resume(); }, {once:false});
  addEventListener('keydown', ()=>{ if (AC && AC.state==='suspended') AC.resume(); });

  const MAKE = {};

  /* =====================================================================
     게임 1 · 과일 자르기
     ===================================================================== */
  MAKE.slice = () => {
    const FR = [
      {c:'#D9455F', in:'#F4C3CB', r:44},
      {c:'#C0432E', in:'#F0D8C6', r:34},
      {c:'#E39B6A', in:'#F7DDBE', r:34},
      {c:'#7FA84A', in:'#DDEAC0', r:30},
      {c:'#7A5AA8', in:'#DCCDEF', r:28},
      {c:'#E0C04A', in:'#F6EAB6', r:30},
    ];
    function drawWhole(f){
      ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot);
      ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(0,0,f.r,0,7); ctx.fill();
      if (f.bomb){
        ctx.strokeStyle='#6B747C'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(0,-f.r); ctx.quadraticCurveTo(14,-f.r-16,4,-f.r-26); ctx.stroke();
        ctx.fillStyle='#E36A4A'; ctx.beginPath(); ctx.arc(4,-f.r-28,5,0,7); ctx.fill();
      } else {
        ctx.fillStyle='rgba(255,255,255,.22)';
        ctx.beginPath(); ctx.ellipse(-f.r*0.32,-f.r*0.36,f.r*0.3,f.r*0.2,-0.6,0,7); ctx.fill();
      }
      ctx.restore();
    }
    function drawHalf(b){
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
      ctx.globalAlpha = clamp(b.life,0,1);
      ctx.fillStyle=b.c; ctx.beginPath(); ctx.arc(0,0,b.r,b.ang,b.ang+Math.PI); ctx.fill();
      ctx.fillStyle=b.inc; ctx.beginPath(); ctx.arc(0,0,b.r*0.78,b.ang,b.ang+Math.PI); ctx.fill();
      ctx.globalAlpha=1; ctx.restore();
    }
    return {
      title:'과일 자르기', time:60, score:0, combo:0, comboT:0,
      items:[], bits:[], spark:[], spawnT:0.6,
      update(dt){
        this.time -= dt;
        if (this.time<=0){ this.time=0; endGame(); return; }
        this.comboT -= dt; if (this.comboT<=0) this.combo=0;

        this.spawnT -= dt;
        if (this.spawnT<=0){
          const prog = 1 - this.time/60;
          this.spawnT = rand(0.55,1.0) - prog*0.28;
          const n = Math.random() < 0.28+prog*0.2 ? 2 : 1;
          for(let i=0;i<n;i++) this.spawn(prog);
        }
        for (const f of this.items){
          f.vy += 720*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.rot += f.spin*dt;
          if (f.y > H+100) f.dead = true;
          if (f.cut) continue;
          if (vel > 420 && segDist(f.x,f.y, prev.x,prev.y, cur.x,cur.y) < f.r+26) this.cut(f);
        }
        this.items = this.items.filter(f=>!f.dead);
        for (const b of this.bits){
          b.vy += 900*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.rot += b.spin*dt; b.life -= dt;
          if (b.life<=0 || b.y>H+100) b.dead=true;
        }
        this.bits = this.bits.filter(b=>!b.dead);
        for (const s of this.spark){
          s.vy += 500*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
          if (s.life<=0) s.dead=true;
        }
        this.spark = this.spark.filter(s=>!s.dead);
      },
      spawn(prog){
        const bomb = Math.random() < 0.05 + prog*0.05;
        const t = bomb ? {c:'#22262A', in:'#3A4148', r:30} : FR[Math.floor(Math.random()*FR.length)];
        const x = rand(W*0.15, W*0.85);
        this.items.push({
          x, y:H+60, r:t.r, c:t.c, inc:t.in, bomb,
          vx:(W/2-x)*rand(0.25,0.5), vy:-rand(660,780),
          rot:0, spin:rand(-3,3), cut:false, dead:false
        });
      },
      cut(f){
        f.cut = true; f.dead = true;
        const ang = Math.atan2(cur.y-prev.y, cur.x-prev.x);
        for(let s=-1;s<=1;s+=2){
          this.bits.push({x:f.x,y:f.y,r:f.r,c:f.c,inc:f.inc,ang,
            vx:Math.cos(ang+s*1.6)*220+f.vx*0.4, vy:Math.sin(ang+s*1.6)*220+f.vy*0.4,
            rot:f.rot, spin:s*4, life:1.8, dead:false});
        }
        for(let i=0;i<16;i++){
          this.spark.push({x:f.x,y:f.y,c:f.bomb?'#8A939B':f.inc,
            vx:rand(-260,260), vy:rand(-320,120), r:rand(2,6), life:rand(.4,.9), dead:false});
        }
        if (f.bomb){ this.score -= 10; this.combo=0; shake=14; flash=.3; }
        else { this.combo++; this.comboT=0.55; this.score += 10*Math.min(this.combo,6); }
      },
      draw(){
        const g = ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,'#3A2E22'); g.addColorStop(1,'#241C14');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        ctx.strokeStyle='rgba(255,255,255,.028)'; ctx.lineWidth=2;
        for(let y=30;y<H;y+=46){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

        for (const s of this.spark){
          ctx.globalAlpha = clamp(s.life,0,1);
          ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
        }
        ctx.globalAlpha=1;
        for (const b of this.bits) drawHalf(b);
        for (const f of this.items) drawWhole(f);

        hud(this, [['점수', Math.round(this.score)], ['남은 시간', Math.ceil(this.time)+'초']]);
        if (this.combo>1) txt(this.combo+' 연속', cur.x, cur.y-44, 22, 'rgba(227,155,106,.95)', 700);
      }
    };
  };

  /* =====================================================================
     게임 2 · 표적 사격
     ===================================================================== */
  MAKE.target = () => ({
    title:'표적 사격', time:40, score:0, shots:0, hit:0, combo:0,
    targets:[], marks:[], spawnT:0.3, msg:'', msgT:0,
    update(dt){
      this.time -= dt;
      if (this.time<=0){ this.time=0; endGame(); return; }
      this.msgT -= dt; this.spawnT -= dt;
      const prog = 1 - this.time/40;
      if (this.spawnT<=0 && this.targets.length < 5){
        this.spawnT = rand(0.3,0.7);
        const r = rand(48,80) - prog*10;
        const t = {x:rand(r+40, W-r-40), y:rand(r+90, H*0.82-r), r,
          life:rand(2.6,3.8)-prog*0.6, drift:rand(-30,30)*prog, born:0};
        t.max = t.life; this.targets.push(t);
      }
      for (const t of this.targets){
        t.life -= dt; t.born += dt; t.x += t.drift*dt;
        if (t.x<t.r+20 || t.x>W-t.r-20) t.drift*=-1;
        if (t.life<=0){ t.dead=true; this.combo=0; }
      }
      this.targets = this.targets.filter(t=>!t.dead);
      for (const m of this.marks){ m.life-=dt; if(m.life<=0) m.dead=true; }
      this.marks = this.marks.filter(m=>!m.dead);
    },
    fire(){
      this.shots++;
      let got = null;
      for (const t of this.targets)
        if (Math.hypot(cur.x-t.x, cur.y-t.y) < t.r*1.3){ got = t; break; }
      this.marks.push({x:cur.x, y:cur.y, life:0.5, ok:!!got});
      if (got){
        got.dead = true; this.hit++; this.combo++;
        const acc = clamp(1 - Math.hypot(cur.x-got.x, cur.y-got.y)/got.r, 0, 1);
        const base = Math.round(50 + acc*40);
        const gain = base*Math.min(this.combo,5);
        this.score += gain;
        this.msg = (acc>0.7 ? '정중앙  +' : '명중  +') + gain;
        this.msgT = 0.8;
      } else {
        this.combo = 0; shake = 5;
        this.msg = '빗나감'; this.msgT = 0.6;
      }
    },
    draw(){
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#7FB6D4'); g.addColorStop(0.72,'#C3E0EC');
      g.addColorStop(0.72,'#5E8F3E'); g.addColorStop(1,'#3E6A28');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(255,255,255,.5)';
      const drift = (performance.now()/90) % (W+240);
      for(let i=0;i<5;i++){
        const cx = ((i*W/5 + drift) % (W+240)) - 120, cy = 90+i*34;
        ctx.beginPath();
        ctx.arc(cx,cy,30,0,7); ctx.arc(cx+34,cy-8,38,0,7); ctx.arc(cx+72,cy,26,0,7);
        ctx.fill();
      }
      for (const t of this.targets){
        const k = clamp(t.life/t.max,0,1), pop = clamp(t.born*7,0,1), r = t.r*pop;
        ctx.globalAlpha = 0.35 + k*0.65;
        [['#F2EEE6',1],['#C4553F',0.72],['#F2EEE6',0.46],['#C4553F',0.22]].forEach(p=>{
          ctx.fillStyle=p[0]; ctx.beginPath(); ctx.arc(t.x,t.y,r*p[1],0,7); ctx.fill();
        });
        ctx.globalAlpha=1;
        ctx.strokeStyle='rgba(27,30,26,.35)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(t.x,t.y,r,0,7); ctx.stroke();
      }
      for (const m of this.marks){
        ctx.globalAlpha = clamp(m.life*2,0,1);
        ctx.strokeStyle = m.ok ? '#1F4A38' : 'rgba(27,30,26,.5)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(m.x,m.y,7,0,7); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      hud(this, [
        ['점수', Math.round(this.score)],
        ['남은 시간', Math.ceil(this.time)+'초'],
        ['명중률', this.shots ? Math.round(this.hit/this.shots*100)+'%' : '—'],
      ], true);
      if (this.msgT>0){
        ctx.globalAlpha = clamp(this.msgT*2,0,1);
        txt(this.msg, cur.x, cur.y-42, 20, '#1B1E1A', 700);
        ctx.globalAlpha = 1;
      }
    }
  });

  MAKE.space = () => {
    const stars = Array.from({length:120}, ()=>({x:rand(0,W), y:rand(0,H), z:rand(.3,1)}));
    return {
      title:'우주 슈팅', score:0, lives:5, t:0,
      shipX:W/2, bul:[], foes:[], boom:[], spawnT:1, cool:0,
      update(dt){
        this.t += dt; this.cool -= dt;
        for (const s of stars){ s.y += (40+s.z*180)*dt; if (s.y>H){ s.y=-4; s.x=rand(0,W); } }
        this.shipX += (cur.x - this.shipX)*0.25;
        this.shipX = clamp(this.shipX, 34, W-34);

        const lvl = 1 + this.t/48;
        this.spawnT -= dt;
        if (this.spawnT<=0){
          this.spawnT = rand(0.9,1.5)/lvl;
          this.foes.push({x:rand(40,W-40), y:-30, r:rand(20,28),
            vx:rand(-50,50)*Math.min(lvl,1.8), vy:rand(58,88)*Math.min(lvl,2.0),
            hue:Math.floor(rand(0,3))});
        }
        for (const b of this.bul){ b.y -= 760*dt; if (b.y<-20) b.dead=true; }
        for (const f of this.foes){
          f.x += f.vx*dt; f.y += f.vy*dt;
          if (f.x<f.r+10 || f.x>W-f.r-10) f.vx*=-1;
          if (f.y > H-40){ f.dead=true; this.hurt(); continue; }
          if (Math.abs(f.x-this.shipX)<f.r+9 && Math.abs(f.y-(H-70))<f.r+8){ f.dead=true; this.hurt(); continue; }
          for (const b of this.bul){
            if (!b.dead && Math.hypot(b.x-f.x, b.y-f.y) < f.r+14){
              b.dead=true; f.dead=true; this.score += 25;
              for(let i=0;i<14;i++) this.boom.push({x:f.x,y:f.y,vx:rand(-200,200),vy:rand(-200,200),
                r:rand(2,5), life:rand(.3,.7), dead:false});
            }
          }
        }
        this.bul = this.bul.filter(b=>!b.dead);
        this.foes = this.foes.filter(f=>!f.dead);
        for (const p of this.boom){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0)p.dead=true; }
        this.boom = this.boom.filter(p=>!p.dead);
      },
      hurt(){ this.lives--; shake=18; flash=.4; if (this.lives<=0) endGame(); },
      fire(){
        if (this.cool>0) return;
        this.cool = 0.11;
        this.bul.push({x:this.shipX, y:H-84, dead:false});
      },
      draw(){
        const g = ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,'#12132A'); g.addColorStop(1,'#080A16');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        for (const s of stars){
          ctx.fillStyle='rgba(237,235,228,'+(0.15+s.z*0.5).toFixed(2)+')';
          ctx.fillRect(s.x, s.y, 1.6, 1.6+s.z*3);
        }
        for (const p of this.boom){
          ctx.globalAlpha = clamp(p.life*1.6,0,1); ctx.fillStyle='#E39B6A';
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
        }
        ctx.globalAlpha=1;
        const cols=['#C4553F','#5C8FD6','#8E6BC4'];
        for (const f of this.foes){
          ctx.fillStyle=cols[f.hue];
          ctx.beginPath();
          ctx.moveTo(f.x, f.y+f.r); ctx.lineTo(f.x-f.r, f.y-f.r*0.6);
          ctx.lineTo(f.x, f.y-f.r*0.15); ctx.lineTo(f.x+f.r, f.y-f.r*0.6);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle='rgba(237,235,228,.85)';
          ctx.beginPath(); ctx.arc(f.x, f.y-f.r*0.1, f.r*0.22, 0, 7); ctx.fill();
        }
        ctx.fillStyle='#E39B6A';
        for (const b of this.bul){ roundRect(b.x-2.5, b.y-14, 5, 18, 2.5); ctx.fill(); }
        const sx=this.shipX, sy=H-70;
        ctx.fillStyle='rgba(227,155,106,'+(0.5+Math.random()*0.4).toFixed(2)+')';
        ctx.beginPath(); ctx.moveTo(sx-6,sy+10); ctx.lineTo(sx,sy+10+rand(10,22)); ctx.lineTo(sx+6,sy+10); ctx.fill();
        ctx.fillStyle='#EDEBE4';
        ctx.beginPath(); ctx.moveTo(sx, sy-22); ctx.lineTo(sx-19, sy+16);
        ctx.lineTo(sx, sy+8); ctx.lineTo(sx+19, sy+16); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#2F7A5B';
        ctx.beginPath(); ctx.arc(sx, sy-4, 5, 0, 7); ctx.fill();

        hud(this, [['점수', Math.round(this.score)], ['목숨', '●'.repeat(Math.max(0,this.lives))]]);
      }
    };
  };

  /* =====================================================================
     게임 4 · 리듬 스윙
     ===================================================================== */
  MAKE.rhythm = () => {
    const DIRS = [
      {x:0.24, mark:'왼쪽',  ang:Math.PI},
      {x:0.41, mark:'위',    ang:-Math.PI/2},
      {x:0.58, mark:'아래',  ang:Math.PI/2},
      {x:0.75, mark:'오른쪽',ang:0},
    ];
    const BPM = 104, beat = 60/BPM, FALL = 1.75, DUR = 62;
    const notes = [];
    for (let b=4; b*beat < DUR; b++){
      const bar = Math.floor(b/4);
      const density = bar<4 ? 0.45 : bar<10 ? 0.62 : 0.78;
      if (Math.random() < density)
        notes.push({t:b*beat, d:Math.floor(rand(0,4)), hit:false, miss:false});
      if (bar>=8 && Math.random()<0.16)
        notes.push({t:b*beat+beat/2, d:Math.floor(rand(0,4)), hit:false, miss:false});
    }
    return {
      title:'리듬 스윙', score:0, combo:0, bestCombo:0, hits:0, total:notes.length,
      t:0, cool:0, msg:'', msgT:0, flashD:-1, flashT:0, lastBeat:-1,
      update(dt){
        this.t += dt;
        if (this.t > DUR + 2.5){ endGame(); return; }
        this.cool -= dt; this.msgT -= dt; this.flashT -= dt;

        const nb = Math.floor(this.t/beat);
        if (nb !== this.lastBeat){ this.lastBeat = nb; blip(nb%4===0?70:150, .07, 'sine', .16); }

        const dx = cur.x-prev.x, dy = cur.y-prev.y;
        const sp = Math.hypot(dx,dy)/Math.max(dt,0.001);
        if (sp > 520 && this.cool<=0){
          this.cool = 0.15;
          const d = Math.abs(dx)>Math.abs(dy) ? (dx>0?3:0) : (dy>0?2:1);
          this.judge(d);
        }
        for (const n of notes)
          if (!n.hit && !n.miss && this.t-n.t > 0.28){
            n.miss = true; this.combo = 0; this.msg = '놓침'; this.msgT = .45;
          }
      },
      judge(d){
        let pick = null, bd = 1;
        for (const n of notes){
          if (n.hit || n.miss || n.d !== d) continue;
          const diff = Math.abs(n.t - this.t);
          if (diff < 0.28 && diff < bd){ bd = diff; pick = n; }
        }
        if (pick){
          pick.hit = true; this.hits++; this.combo++;
          this.bestCombo = Math.max(this.bestCombo, this.combo);
          const perfect = bd < 0.10;
          this.score += (perfect?100:60) * Math.min(1+Math.floor(this.combo/10), 4);
          this.msg = perfect ? '완벽' : '좋음'; this.msgT = .45;
          this.flashD = d; this.flashT = .22;
          blip(perfect?880:660, .09, 'triangle', .2);
        } else { this.combo = 0; this.msg = '헛스윙'; this.msgT = .35; }
      },
      draw(){
        const g = ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,'#1A1430'); g.addColorStop(1,'#0B0916');
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

        const lineY = H*0.80, topY = -50;
        DIRS.forEach((D,i)=>{
          const x = D.x*W, lw = W*0.13;
          ctx.fillStyle = (this.flashT>0 && this.flashD===i)
            ? 'rgba(227,155,106,.16)' : 'rgba(237,235,228,.035)';
          ctx.fillRect(x-lw/2, 0, lw, H);
          ctx.strokeStyle='rgba(237,235,228,.10)'; ctx.lineWidth=1;
          ctx.strokeRect(x-lw/2, 0, lw, H);
          arrow(x, lineY, 22, D.ang, 'rgba(237,235,228,.22)', true);
          txt(D.mark, x, lineY+52, 13, 'rgba(237,235,228,.3)', 500);
        });
        ctx.strokeStyle='rgba(227,155,106,.5)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(0,lineY); ctx.lineTo(W,lineY); ctx.stroke();

        for (const n of notes){
          if (n.hit) continue;
          const k = (n.t - this.t)/FALL;
          if (k > 1.05 || k < -0.25) continue;
          const y = lineY - k*(lineY - topY);
          const D = DIRS[n.d];
          arrow(D.x*W, y, 26, D.ang, n.miss ? 'rgba(140,133,121,.4)' : '#E39B6A', false);
        }

        hud(this, [
          ['점수', Math.round(this.score)],
          ['콤보', this.combo],
          ['남은 시간', Math.max(0, Math.ceil(DUR-this.t))+'초'],
        ]);
        if (this.msgT>0){
          ctx.globalAlpha = clamp(this.msgT*2.5,0,1);
          txt(this.msg, W/2, lineY-90, 30, '#EDEBE4', 700);
          ctx.globalAlpha = 1;
        }
      }
    };
    function arrow(x,y,r,ang,color,outline){
      ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.lineTo(-r*0.5,-r*0.8); ctx.lineTo(-r*0.15,0); ctx.lineTo(-r*0.5,r*0.8);
      ctx.closePath();
      if (outline){ ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); }
      else { ctx.fillStyle=color; ctx.fill(); }
      ctx.restore();
    }
  };

  /* =====================================================================
     게임 5 · 구슬 미로
     ===================================================================== */
  MAKE.maze = () => {
    // 좌표는 판 크기 대비 0~1 비율
    const STAGES = [
      { start:[0.5,0.88], goal:[0.5,0.10],
        walls:[[0,0.45,0.62,0.055],[0.80,0.45,0.20,0.055]],
        holes:[[0.28,0.70,0.05],[0.72,0.22,0.05]] },
      { start:[0.12,0.90], goal:[0.88,0.10],
        walls:[[0,0.30,0.70,0.05],[0.30,0.62,0.70,0.05]],
        holes:[[0.86,0.46,0.05],[0.14,0.80,0.05],[0.50,0.14,0.045]] },
      { start:[0.10,0.92], goal:[0.90,0.08],
        walls:[[0,0.25,0.55,0.045],[0.45,0.50,0.55,0.045],[0,0.75,0.55,0.045]],
        holes:[[0.76,0.36,0.05],[0.24,0.62,0.05],[0.72,0.87,0.05],[0.30,0.12,0.045]] },
      { start:[0.08,0.92], goal:[0.92,0.08],
        walls:[[0.45,0,0.06,0.38],[0.45,0.52,0.06,0.48],[0,0.45,0.36,0.06],[0.64,0.45,0.36,0.06]],
        holes:[[0.22,0.22,0.055],[0.78,0.22,0.055],[0.22,0.78,0.055],[0.78,0.78,0.055]] },
    ];
    return {
      title:'구슬 미로', score:0, time:70, stage:0, clears:0,
      ball:{x:0,y:0,vx:0,vy:0}, shakeT:0, msg:'', msgT:0, S:0, bx:0, by:0,
      layout(){
        this.S = Math.min(W*0.52, H*0.84);
        this.bx = (W-this.S)/2; this.by = (H-this.S)/2 + 8;
      },
      reset(){
        this.layout();
        const st = STAGES[this.stage % STAGES.length];
        this.ball.x = st.start[0]; this.ball.y = st.start[1];
        this.ball.vx = 0; this.ball.vy = 0;
      },
      update(dt){
        if (!this.S) this.reset();
        this.time -= dt; this.msgT -= dt;
        if (this.time<=0){ this.time=0; endGame(); return; }
        this.layout();
        const st = STAGES[this.stage % STAGES.length];
        const b = this.ball, R = 0.032;

        // 기울기를 가속도로
        const K = 0.55;
        b.vx += (tilt.g/30)*K*dt*6;
        b.vy += (tilt.b/30)*K*dt*6;
        b.vx *= (1 - 1.4*dt); b.vy *= (1 - 1.4*dt);
        const sp = Math.hypot(b.vx,b.vy), MAX = 1.5;
        if (sp > MAX){ b.vx = b.vx/sp*MAX; b.vy = b.vy/sp*MAX; }

        b.x += b.vx*dt; b.y += b.vy*dt;

        // 바깥 테두리
        if (b.x < R){ b.x = R; b.vx = -b.vx*0.4; }
        if (b.x > 1-R){ b.x = 1-R; b.vx = -b.vx*0.4; }
        if (b.y < R){ b.y = R; b.vy = -b.vy*0.4; }
        if (b.y > 1-R){ b.y = 1-R; b.vy = -b.vy*0.4; }

        // 벽 충돌
        for (const w of st.walls){
          const cx = clamp(b.x, w[0], w[0]+w[2]), cy = clamp(b.y, w[1], w[1]+w[3]);
          const dx = b.x-cx, dy = b.y-cy, d = Math.hypot(dx,dy);
          if (d < R){
            if (d < 1e-6){ b.y = w[1] - R; b.vy = -Math.abs(b.vy)*0.4; continue; }
            const nx = dx/d, ny = dy/d, push = R-d;
            b.x += nx*push; b.y += ny*push;
            const dot = b.vx*nx + b.vy*ny;
            b.vx -= 1.4*dot*nx; b.vy -= 1.4*dot*ny;
          }
        }
        // 구멍
        for (const h of st.holes){
          if (Math.hypot(b.x-h[0], b.y-h[1]) < h[2]*0.75){
            this.msg = '구멍에 빠졌습니다'; this.msgT = 1.1;
            shake = 12; this.reset(); return;
          }
        }
        // 골
        if (Math.hypot(b.x-st.goal[0], b.y-st.goal[1]) < 0.055){
          this.clears++; this.score += 250; this.stage++;
          this.msg = this.clears+'단계 통과  +250'; this.msgT = 1.4;
          blip(760, .12, 'triangle', .2);
          this.reset();
        }
      },
      draw(){
        if (!this.S) this.layout();
        const st = STAGES[this.stage % STAGES.length];
        const S=this.S, bx=this.bx, by=this.by;
        const X=u=>bx+u*S, Y=u=>by+u*S, L=u=>u*S;

        ctx.fillStyle='#151A17'; ctx.fillRect(0,0,W,H);
        // 판
        ctx.fillStyle='#3A2E22'; roundRect(bx-14, by-14, S+28, S+28, 16); ctx.fill();
        ctx.fillStyle='#4A3B2C'; roundRect(bx, by, S, S, 8); ctx.fill();
        ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1;
        for(let i=1;i<10;i++){ ctx.beginPath(); ctx.moveTo(bx,Y(i/10)); ctx.lineTo(bx+S,Y(i/10)); ctx.stroke(); }

        for (const h of st.holes){
          ctx.fillStyle='#121513';
          ctx.beginPath(); ctx.arc(X(h[0]), Y(h[1]), L(h[2]), 0, 7); ctx.fill();
        }
        ctx.strokeStyle='#2F7A5B'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(X(st.goal[0]), Y(st.goal[1]), L(0.055), 0, 7); ctx.stroke();
        ctx.fillStyle='rgba(47,122,91,.25)';
        ctx.beginPath(); ctx.arc(X(st.goal[0]), Y(st.goal[1]), L(0.055), 0, 7); ctx.fill();

        ctx.fillStyle='#2B2119';
        for (const w of st.walls) roundRect(X(w[0]), Y(w[1]), L(w[2]), L(w[3]), 4), ctx.fill();

        const b = this.ball;
        ctx.fillStyle='rgba(0,0,0,.3)';
        ctx.beginPath(); ctx.arc(X(b.x)+3, Y(b.y)+4, L(0.032), 0, 7); ctx.fill();
        ctx.fillStyle='#DDD9D0';
        ctx.beginPath(); ctx.arc(X(b.x), Y(b.y), L(0.032), 0, 7); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(X(b.x)-L(0.011), Y(b.y)-L(0.012), L(0.010), 0, 7); ctx.fill();

        hud(this, [
          ['점수', Math.round(this.score)],
          ['통과', this.clears+'단계'],
          ['남은 시간', Math.ceil(this.time)+'초'],
        ]);
        if (this.msgT>0){
          ctx.globalAlpha = clamp(this.msgT,0,1);
          txt(this.msg, W/2, by-34, 22, '#EDEBE4', 700);
          ctx.globalAlpha = 1;
        }
      }
    };
  };

  /* ---------- HUD ---------- */
  function hud(g, rows, dark){
    const c = dark ? '#1B1E1A' : '#EDEBE4';
    const m = dark ? 'rgba(27,30,26,.55)' : 'rgba(237,235,228,.5)';
    const x = W - 34;
    rows.forEach((r,i)=>{
      const y = 52 + i*54;
      txt(r[0], x, y-20, 12, m, 500, 'right');
      mono(String(r[1]), x, y+6, 26, c, 'right');
    });
    txt(g.title, 34, 50, 17, m, 600, 'left');
  }

  /* ---------- 메뉴 · 결과 ---------- */
  function drawMenu(){
    ctx.fillStyle='#0F1512'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(237,235,228,.04)'; ctx.lineWidth=1;
    for(let x=0;x<W;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    txt('세미콜론 리모트', W/2, H*0.19, 15, 'rgba(237,235,228,.42)', 500);
    txt('겨누고 A를 눌러 고르세요', W/2, H*0.19+36, 30, '#EDEBE4', 700);

    const cols = 3, rows = Math.ceil(MENU.length/cols);
    const cw = Math.min(250, (W-140)/cols), ch = 172, gap = 22;
    const y0 = H*0.34 - (rows-1)*(ch+gap)/2 + (rows>1 ? 30 : 0);
    let hovered = -1;
    MENU.forEach((m,i)=>{
      const r = Math.floor(i/cols), c = i%cols;
      const inRow = Math.min(cols, MENU.length - r*cols);
      const rowW = cw*inRow + gap*(inRow-1);
      const x = (W-rowW)/2 + c*(cw+gap), y = y0 + r*(ch+gap);
      const on = cur.x>x && cur.x<x+cw && cur.y>y && cur.y<y+ch;
      if (on) hovered = i;
      ctx.fillStyle = on ? 'rgba(237,235,228,.10)' : 'rgba(237,235,228,.035)';
      roundRect(x, y, cw, ch, 18); ctx.fill();
      ctx.strokeStyle = on ? m.color : 'rgba(237,235,228,.12)';
      ctx.lineWidth = on ? 2.5 : 1; ctx.stroke();
      ctx.fillStyle = m.color;
      ctx.beginPath(); ctx.arc(x+cw/2, y+46, on?19:15, 0, 7); ctx.fill();
      txt(m.name, x+cw/2, y+98, 19, '#EDEBE4', 700);
      txt(m.desc, x+cw/2, y+122, 12, 'rgba(237,235,228,.45)', 500);
      const b = best(m.id)[0];
      mono(b!=null ? '최고 '+b : '기록 없음', x+cw/2, y+150, 12,
        b!=null ? 'rgba(227,155,106,.9)' : 'rgba(237,235,228,.28)');
    });
    if (hovered >= 0) menuIdx = hovered;
    if (!ref) txt('폰에서 조준 맞추기를 먼저 눌러주세요', W/2, H-72, 15, 'rgba(237,235,228,.3)', 500);
  }

  function drawResult(){
    ctx.fillStyle='rgba(15,21,18,.88)'; ctx.fillRect(0,0,W,H);
    const g = MENU.find(m=>m.id===gameId);
    txt(g.name, W/2, H*0.24, 16, 'rgba(237,235,228,.45)', 500);
    txt('기록', W/2, H*0.24+36, 26, '#EDEBE4', 600);
    mono(String(Math.max(0,Math.round(game.score))), W/2, H*0.24+130, 84, '#E39B6A');
    txt('최고 기록', W/2, H*0.60, 13, 'rgba(237,235,228,.4)', 500);
    best(gameId).slice(0,5).forEach((s,i)=>{
      mono((i+1)+'    '+s, W/2, H*0.60+32+i*26, 16,
        i===0 ? 'rgba(237,235,228,.9)' : 'rgba(237,235,228,.45)');
    });
    txt('A 다시하기        B 메뉴로', W/2, H-64, 16, 'rgba(237,235,228,.6)', 600);
  }

  /* ---------- 커서 ---------- */
  function drawCursor(){
    const held = performance.now()-lastA < 110;
    ctx.strokeStyle = held ? '#2F7A5B' : '#E39B6A';
    ctx.lineWidth = held ? 4 : 2.5;
    ctx.beginPath(); ctx.arc(cur.x,cur.y, held?13:17, 0, 7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cur.x-25,cur.y); ctx.lineTo(cur.x-7,cur.y);
    ctx.moveTo(cur.x+7,cur.y);  ctx.lineTo(cur.x+25,cur.y);
    ctx.moveTo(cur.x,cur.y-25); ctx.lineTo(cur.x,cur.y-7);
    ctx.moveTo(cur.x,cur.y+7);  ctx.lineTo(cur.x,cur.y+25);
    ctx.stroke();
  }
  function drawTrail(now){
    while (trail.length && now-trail[0].t > 200) trail.shift();
    ctx.lineCap='round';
    for(let i=1;i<trail.length;i++){
      const a = i/trail.length;
      ctx.strokeStyle='rgba(242,238,230,'+(a*0.7).toFixed(3)+')';
      ctx.lineWidth = 2 + a*7;
      ctx.beginPath(); ctx.moveTo(trail[i-1].x,trail[i-1].y); ctx.lineTo(trail[i].x,trail[i].y); ctx.stroke();
    }
  }

  /* ---------- 루프 ---------- */
  function loop(now){
    const dt = Math.min((now-last)/1000, 0.05); last = now;
    prev.x = cur.x; prev.y = cur.y;
    // 왕복 지연의 절반 + 마지막 수신 이후 흐른 시간만큼 목표점을 앞으로 당긴다
    const lead = clamp(rtt/2, 0, 110)/1000 + clamp((now-rawT)/1000, 0, 0.05);
    const tx = clamp(raw.x + rawV.x*lead, 0, W);
    const ty = clamp(raw.y + rawV.y*lead, 0, H);
    const k = 1 - Math.exp(-dt/0.030);
    cur.x += (tx-cur.x)*k; cur.y += (ty-cur.y)*k;
    vel = Math.hypot(cur.x-prev.x, cur.y-prev.y)/Math.max(dt,0.001);
    trail.push({x:cur.x, y:cur.y, t:now});

    ctx.save();
    if (shake>0){ ctx.translate(rand(-shake,shake), rand(-shake,shake)); shake*=0.86; if(shake<0.4)shake=0; }

    if (scene==='play'){ game.update(dt); if (scene==='play') game.draw(); else { game.draw(); drawResult(); } }
    else if (scene==='menu') drawMenu();
    else { game.draw(); drawResult(); }

    if (scene==='play' && (gameId==='slice' || gameId==='rhythm')) drawTrail(now);
    drawCursor();
    ctx.restore();

    if (flash>0){ ctx.fillStyle='rgba(255,120,90,'+flash.toFixed(3)+')'; ctx.fillRect(0,0,W,H); flash*=0.85; if(flash<0.01)flash=0; }
    if (!ref && scene==='play')
      txt('조준이 맞춰지지 않았습니다 — 폰에서 조준 맞추기', W/2, H-28, 14, 'rgba(237,235,228,.35)', 500);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* ---------- 마우스 대체 조작 ---------- */
  cv.addEventListener('mousemove', e => { if(!ref) ref={a:0,b:0}; raw.x=e.clientX; raw.y=e.clientY; });
  cv.addEventListener('mousedown', e => { e.preventDefault();
    if(e.button===0){ lastA=performance.now(); pressA(); } else pressB(); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (e.key==='1'){ DEG_X=28; DEG_Y=18; }
    if (e.key==='2'){ DEG_X=40; DEG_Y=26; }
    if (e.key==='3'){ DEG_X=55; DEG_Y=36; }
    if (e.key==='c'||e.key==='C') ref=null;
    if (e.key==='m'||e.key==='M'){ scene='menu'; sendPad('menu'); }
    if (e.key==='h'||e.key==='H'){ const p=$('#panel'); p.style.display = p.style.display==='none'?'block':'none'; }
  });

  /* ---------- 연결 ---------- */
  let conn = null;
  function sendPad(mode){ if (conn && conn.open) conn.send({t:'pad', mode}); }
  const peer = new Peer(PREFIX+code, {debug:0, config:ICE});
  peer.on('open', ()=>{ $('#state').textContent='컨트롤러 기다리는 중'; });
  peer.on('error', e=>{
    const map = {
      'unavailable-id':'같은 코드의 화면이 이미 열려 있습니다. 다른 창을 닫으세요.',
      'network':'중계 서버에 연결하지 못했습니다. 방화벽을 확인하세요.',
      'browser-incompatible':'이 브라우저는 지원하지 않습니다. 크롬을 쓰세요.',
      'server-error':'중계 서버 오류. 잠시 후 새로고침하세요.',
    };
    $('#state').textContent = map[e.type] || ('연결 오류 · ' + e.type);
    $('#panel').style.display = 'block';
  });
  if (location.protocol === 'file:')
    $('#state').textContent = '파일을 직접 열면 연결되지 않습니다. 웹 주소로 여세요.';
  peer.on('connection', c => {
    if (conn && conn.open) conn.close();
    conn = c;
    c.on('open', ()=>{
      $('#dot').classList.add('on'); $('#state').textContent='컨트롤러 연결됨';
      $('#panel').style.display='none';
      sendPad(scene==='play' ? gameId : scene);
    });
    c.on('data', d => {
      if (d.t==='o') applyOrientation(d);
      else if (d.t==='cal') ref = {a:d.a, b:d.b, g:d.g||0};
      else if (d.t==='btn' && d.down){
        if (d.k==='A'){ lastA=performance.now(); pressA(); } else pressB();
      }
      else if (d.t==='pong'){
        const r = Date.now()-d.ts;
        rtt = rtt ? rtt*0.7 + r*0.3 : r;
        $('#ping').textContent = Math.round(rtt)+' ms';
      }
    });
    c.on('close', ()=>{
      $('#dot').classList.remove('on'); $('#state').textContent='연결 끊김';
      $('#panel').style.display='block';
    });
  });
  setInterval(()=>{ if(conn&&conn.open) conn.send({t:'ping', ts:Date.now()}); }, 1500);

  // 직접 연결인지 TURN 중계인지 확인 — 중계면 지연이 크게 늘어난다
  setInterval(async ()=>{
    const pc = conn && conn.peerConnection;
    if (!pc || !pc.getStats) return;
    try {
      const stats = await pc.getStats(), byId = new Map();
      stats.forEach(r => byId.set(r.id, r));
      let type = null;
      stats.forEach(r => {
        if (r.type==='candidate-pair' && r.state==='succeeded' && r.localCandidateId){
          const c = byId.get(r.localCandidateId);
          if (c) type = c.candidateType;
        }
      });
      const label = {host:'같은 망 직접', srflx:'직접', prflx:'직접', relay:'중계 · 느림'};
      $('#path').textContent = label[type] || '—';
    } catch(e){}
  }, 3000);
}

function randCode(){
  const s='ABCDEFGHJKLMNPQRSTUVWXYZ'; let o='';
  for(let i=0;i<4;i++) o += s[Math.floor(Math.random()*s.length)];
  return o;
}

/* =====================================================================
   컨트롤러
   ===================================================================== */
function startRemote(){
  show('#remote');
  const pre = (P.get('code')||'').toUpperCase();
  if (pre) $('#codein').value = pre;

  $('#btnJoin').onclick = async () => {
    const code = $('#codein').value.trim().toUpperCase();
    if (code.length!==4){ $('#rerr').textContent='코드는 네 글자입니다.'; return; }
    $('#rerr').textContent='';
    try{
      if (typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
        const r = await DeviceOrientationEvent.requestPermission();
        if (r!=='granted'){ $('#rerr').textContent='센서 권한이 필요합니다. 설정 > Safari > 동작 및 방향 접근을 켜주세요.'; return; }
      }
    }catch(e){ $('#rerr').textContent='센서 권한 요청에 실패했습니다.'; return; }
    connect(code);
  };

  let conn=null, last={a:0,b:0,g:0};
  const PADS = {
    menu:   ['게임을 고르세요', '커서를 게임 위에 올리고 A를 누르세요.'],
    result: ['기록이 나왔습니다', 'A 다시하기 · B 메뉴로'],
    slice:  ['과일 자르기', '폰을 빠르게 휘둘러 과일을 자르세요.<br>폭탄은 피하세요.'],
    target: ['표적 사격', '표적을 겨누고 A로 쏘세요.<br>중앙에 맞출수록 점수가 높습니다.'],
    space:  ['우주 슈팅', '좌우로 움직이고 A로 발사하세요.<br>목숨은 다섯 개입니다.'],
    rhythm: ['리듬 스윙', '내려오는 화살표 방향으로<br>박자에 맞춰 폰을 휘두르세요.'],
    maze:   ['구슬 미로', '폰을 기울여 구슬을 굴리세요.<br>구멍을 피해 초록 원까지.'],
  };
  function setPad(mode){
    const p = PADS[mode]; if(!p) return;
    $('#aimTitle').textContent = p[0];
    $('#aimSub').innerHTML = p[1];
  }

  function connect(code){
    $('#rerr').textContent='연결하는 중…';
    const peer = new Peer({debug:0, config:ICE});
    peer.on('open', ()=>{
      conn = peer.connect(PREFIX+code, {reliable:false});
      conn.on('open', ()=>{
        $('#rjoin').style.display='none'; $('#rpad').style.display='flex';
        $('#rcode').textContent = code; keepAwake(); startSensors();
      });
      conn.on('data', d=>{
        if (d.t==='ping') conn.send({t:'pong', ts:d.ts});
        else if (d.t==='pad') setPad(d.mode);
      });
      conn.on('close', ()=>{ $('#rstate').textContent='연결 끊김 — 새로고침하세요'; });
      conn.on('error', ()=>{ $('#rerr').textContent='연결 실패. 코드를 확인하세요.'; });
    });
    peer.on('error', e=>{
      const map = {
        'peer-unavailable':'해당 코드의 화면을 찾을 수 없습니다. 코드를 확인하세요.',
        'network':'중계 서버에 연결하지 못했습니다. 데이터를 켜고 다시 시도하세요.',
        'browser-incompatible':'이 브라우저는 지원하지 않습니다. 크롬이나 사파리를 쓰세요.',
      };
      $('#rerr').textContent = map[e.type] || ('연결 오류 · ' + e.type);
    });
  }
  function startSensors(){
    let t0 = 0;
    addEventListener('deviceorientation', e=>{
      if (e.alpha==null) return;
      last = {a:e.alpha, b:e.beta, g:e.gamma};
      const n = performance.now(); if (n-t0 < 12) return; t0 = n;
      if (conn && conn.open) conn.send({t:'o', a:last.a, b:last.b, g:last.g});
    }, true);
  }
  const send = o => { if (conn && conn.open) conn.send(o); };
  $('#btnCal').onclick = () => send({t:'cal', a:last.a, b:last.b, g:last.g});
  bind($('#btnA'),'A'); bind($('#btnB'),'B');
  function bind(el,k){
    const dn = e=>{ e.preventDefault(); send({t:'btn',k,down:true});
      if (navigator.vibrate) navigator.vibrate(12); };
    const up = e=>{ e.preventDefault(); send({t:'btn',k,down:false}); };
    el.addEventListener('touchstart',dn,{passive:false});
    el.addEventListener('touchend',up,{passive:false});
    el.addEventListener('mousedown',dn); el.addEventListener('mouseup',up);
  }
  async function keepAwake(){ try{ if('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }catch(e){} }
}
</script>
